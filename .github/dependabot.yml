version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      playwright-framework:
        patterns:
          - '@playwright/*'
          - playwright-bdd
          - allure-playwright
          - typescript
    # Hold TypeScript on the 6.x line. TS 7 is the native (Go) port with a
    # different distribution and toolchain; moving to it is a deliberate
    # evaluation, not a routine bump (see PR #25). Ignoring the major stops
    # Dependabot from re-proposing it every week and blocking the group. Minor
    # and patch updates within 6.x still flow, grouped with Playwright/Allure.
    # Remove this entry when TS 7 is evaluated on its own.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Hold Vitest on the 4.x line. Verified 2026-09-09: vitest 5 passes the unit
      # tests but collapses the mutation score 91% -> 4%, because the latest
      # @stryker-mutator/vitest-runner (10, peers vitest >=2.0.0) cannot do
      # per-test coverage analysis under vitest 5, so the `Unit + mutation` gate
      # goes red. This is an upstream tooling gap, not our config. Remove both
      # entries once @stryker-mutator/vitest-runner ships real vitest-5 support.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
    open-pull-requests-limit: 5
