name: Security Governance

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        # Dependency graph is OFF for this repository, so the action exits 1 with
        # "Dependency review is not supported on this repository" regardless of what a
        # PR changes — a repo flipped from private to public does not get it switched
        # on automatically, and there is no API to enable it. Turn it on under
        # Settings > Code security > Dependency graph, then DELETE this line: the gate
        # below is what blocks a PR that introduces a high-severity advisory.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze
        uses: github/codeql-action/analyze@v4
