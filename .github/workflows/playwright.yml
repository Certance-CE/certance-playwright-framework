name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, no-browser gate: golden-rule lint + type safety.
  lint:
    # Runs on both the declared engines floor and the Active LTS, so the
    # "node >=22" claim in package.json is proven rather than asserted.
    name: Lint + typecheck (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:docs

  # Unit tests + mutation testing over the framework's own logic (no browser, no secrets),
  # plus the SonarQube scan, which reuses the coverage this job already produces.
  unit:
    name: Unit + mutation + Sonar
    runs-on: ubuntu-latest
    env:
      # Read once at job level so the scan step can test for its presence below.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar attributes new code via git blame; a shallow clone breaks it.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:mutation

      # Skipped unless a SONAR_TOKEN secret exists, so the repo stays green before
      # SonarQube Cloud is connected. Also skipped for Dependabot and fork PRs, which
      # get a read-only token with no access to secrets — without this guard every
      # Dependabot PR would show a red X.
      - name: SonarQube scan
        if: >-
          env.SONAR_TOKEN != '' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v8.2.1
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  # BDD suites — no secrets. The showcase runs against a real application the job starts
  # itself; the portability lane runs against a second, public one.
  bdd:
    name: BDD (self-hosted app + TodoMVC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Fetch the demo application
        run: node scripts/fetch-app.js

      - name: Generate BDD specs
        run: npm run bdd:gen

      # The showcase: Playwright starts the application, provisions an account, signs in
      # and runs the suite, then stops it. No hosted dependency, so no third party can
      # decide this build looks like a bot.
      - name: Run BDD showcase (self-hosted app)
        run: npx playwright test --project=setup --project=bdd:app --project=bdd:app-anon

      # The API lane: the same application over HTTP, no browser. Seconds, not minutes.
      - name: Run API lane
        run: npx playwright test --project=api

      # The portability lane: a different application, proving the framework is not
      # welded to one target.
      - name: Run BDD suite (TodoMVC)
        run: npx playwright test --project=bdd:chromium
      # Render the run as GitHub job summaries. Both scripts are dependency-free and
      # never fail the build: a reporting layer must not be able to turn a green
      # suite red. Without these steps the CTRF reporter and the requirement
      # catalogue produce files that nothing ever reads.
      - name: Test summary
        if: always()
        run: npm run ctrf:summary

      # Traceability: requirements/*.md x @req: tags x this run's results.
      # Gaps are reported, not enforced — set REQ_FAIL_ON_GAP=1 to make an
      # uncovered critical/high requirement fail the job.
      - name: Requirement traceability
        if: always()
        run: npm run coverage:requirements

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traceability matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: requirements-coverage
          path: requirements-coverage.md
          retention-days: 14
