name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, no-browser gate: golden-rule lint + type safety.
  lint:
    # Runs on both the declared engines floor and the Active LTS, so the
    # "node >=22" claim in package.json is proven rather than asserted.
    name: Lint + typecheck (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:docs
      # Regenerate the native Playwright agents and fail if the committed copies
      # have drifted from upstream — the fork can never silently lose the grounding loop.
      - run: npm run agents:sync

  # Unit tests + mutation testing over the framework's own logic (no browser, no secrets),
  # plus the SonarQube scan, which reuses the coverage this job already produces.
  unit:
    name: Unit + mutation + Sonar
    runs-on: ubuntu-latest
    env:
      # Read once at job level so the scan step can test for its presence below.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar attributes new code via git blame; a shallow clone breaks it.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Governed Loop gate: fail if this PR mutes a test (skip / fixme / .only) in a test
      # lane without a recorded reason. Runs here for the full history (fetch-depth: 0) the
      # job already checks out. A genuine skip passes with an inline `governed-skip:` note.
      - name: Governed-skip gate
        env:
          GOVERNED_SKIP_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run gate:skips
      - run: npm run test:unit
      - run: npm run test:mutation

      # Skipped unless a SONAR_TOKEN secret exists, so the repo stays green before
      # SonarQube Cloud is connected. Also skipped for Dependabot and fork PRs, which
      # get a read-only token with no access to secrets — without this guard every
      # Dependabot PR would show a red X.
      - name: SonarQube scan
        if: >-
          env.SONAR_TOKEN != '' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  # BDD suites — no secrets. The showcase runs against a real application the job starts
  # itself; the portability lane runs against a second, public one.
  bdd:
    name: BDD (self-hosted app + TodoMVC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Whatever the target needs before a run (the demo: fetch its binary). Defined by the
      # target layer, so retargeting the framework never means editing this workflow.
      - name: Prepare the application under test
        run: npm run setup:app

      # Every lane in one run, in the order app.config.ts declares: Playwright starts the
      # application, provisions an account, signs in, runs the UI, API and portability
      # lanes plus the framework self-tests, then stops it. No hosted dependency, so no
      # third party can decide this build looks like a bot.
      - name: Run the suite
        run: npm test
      # Render the run as GitHub job summaries. Both scripts are dependency-free and
      # never fail the build: a reporting layer must not be able to turn a green
      # suite red. Without these steps the CTRF reporter and the requirement
      # catalogue produce files that nothing ever reads.
      - name: Test summary
        if: always()
        run: npm run ctrf:summary

      # Traceability: requirements/*.md x @req: tags x this run's results.
      # Gaps are reported, not enforced — set REQ_FAIL_ON_GAP=1 to make an
      # uncovered critical/high requirement fail the job.
      # Performance: the budget table for every @perf scenario (Core Web Vitals and engine
      # time), in the run summary. The scenarios themselves fail the suite on a breach;
      # this step only reports, so it can never turn a green run red.
      - name: Performance budgets
        if: always()
        run: npm run perf:summary

      - name: Requirement traceability
        if: always()
        run: npm run coverage:requirements

      # The customer-facing report: one HTML file with the results by business area, every
      # failure's trace, the traceability matrix, the performance table and the trend.
      # History rides in the Actions cache: a branch continues its own, a new branch
      # starts from main's.
      - name: Restore report history
        if: always()
        uses: actions/cache/restore@v6
        with:
          path: allure-history
          key: allure-history-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.head_ref || github.ref_name }}-
            allure-history-main-

      - name: Build the quality report
        if: always()
        run: npm run report

      - name: Save report history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: allure-history
          key: allure-history-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: allure-report/index.html
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: |
            performance-report.md
            perf-results/
          retention-days: 30

      - name: Upload traceability matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: requirements-coverage
          path: requirements-coverage.md
          retention-days: 14
