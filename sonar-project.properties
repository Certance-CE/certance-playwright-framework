# SonarQube analysis for Certance Lens.
#
# Set up (one-time, by a maintainer):
#   1. Import this repository into SonarQube Cloud (free for public repositories).
#   2. Replace sonar.organization below with your organisation key.
#   3. Add a SONAR_TOKEN repository secret.
#   4. In SonarQube Cloud: Administration -> Analysis Method -> turn Automatic
#      Analysis OFF. It cannot import coverage, and running it alongside CI
#      analysis makes builds fail.
#
# Until SONAR_TOKEN exists the scan step skips cleanly — CI stays green.

sonar.projectKey=Certance-CE_certance-playwright-framework
sonar.organization=certance-ce
sonar.projectName=Certance Lens
sonar.sourceEncoding=UTF-8

# The framework IS the product, so pages/ fixtures/ utils/ scripts/ are analysed as
# source and get reliability, security, maintainability and duplication ratings.
# Test code is declared separately so it does not distort those ratings or the
# coverage denominator. Gitignored build output (.features-gen/, allure-results/,
# test-results/, playwright-report/, ctrf/, reports/, coverage/) is excluded
# automatically because Sonar honours SCM ignores by default.
sonar.sources=.
sonar.tests=tests,unit,features/step-definitions

# Unit-test coverage (vitest v8 provider -> lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Honesty clause. These modules are exercised by a real browser through Playwright,
# never by unit tests, so counting them in the coverage denominator would make the
# "coverage on new code" gate permanent noise rather than a signal. They are still
# fully analysed for bugs, smells and security — only coverage is excluded.
sonar.coverage.exclusions=fixtures/**,pages/**,scripts/**,utils/performance.ts,utils/visual.ts,**/*.config.ts,**/*.config.mjs

sonar.exclusions=node_modules/**,coverage/**,test-data/**
